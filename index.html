<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSec Academy - Login</title>
    <link rel="stylesheet" href="code-with-bazigarr.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 30px;
            background: rgba(18, 22, 35, 0.85);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 0, 128, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 5px;
            font-size: 26px;
        }
        .login-card p {
            color: #8b9bb4;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            background: #151b2b;
            border: 1px solid #2a344d;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: #ff2a75;
            box-shadow: 0 0 8px rgba(255, 42, 117, 0.4);
        }
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #8b9bb4;
            margin-bottom: 20px;
        }
        .options a {
            color: #ff2a75;
            text-decoration: none;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #ff2a75, #ff6b3d);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .social-login {
            margin-top: 20px;
            font-size: 13px;
            color: #8b9bb4;
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }
        .social-btn {
            width: 35px;
            height: 35px;
            background: #151b2b;
            border: 1px solid #2a344d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #121623;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 0 30px rgba(0,255,204,0.2);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Main Login Card -->
    <div class="login-card">
        <h2>Login</h2>
        <p>Please sign in to continue</p>
        
        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="login-email" placeholder="Email Address" required>
            </div>
            <div class="input-group">
                <input type="password" id="login-password" placeholder="Password" required>
            </div>
            <div class="options">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="btn-primary">Login →</button>
        </form>

        <div class="social-login">
            <span>or continue with</span>
            <div class="social-icons">
                <a href="#" class="social-btn">G</a>
                <a href="#" class="social-btn">f</a>
                <a href="#" class="social-btn">in</a>
            </div>
        </div>

        <p style="margin-top: 25px; font-size: 13px; color: #8b9bb4;">
            Don't have an account? <a href="#" id="openSignup" style="color: #ff2a75; font-weight: bold; text-decoration: none;">Signup</a>
        </p>
    </div>

    <!-- Sign Up Modal -->
    <div id="signupModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 5px;">Create Account</h2>
            <p style="color: #8b9bb4; font-size: 13px; margin-bottom: 20px;">Join CyberSec Academy today</p>
            <form id="signupForm">
                <div class="input-group">
                    <input type="text" id="su-name" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <input type="email" id="su-email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <input type="number" id="su-age" placeholder="Age" required>
                </div>
                <div class="input-group">
                    <input type="password" id="su-password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 5px;">Send OTP</button>
            </form>
            <button id="closeSignup" style="width:100%; padding:10px; background:transparent; border:1px solid #2a344d; color:#8b9bb4; margin-top:10px; border-radius:10px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <!-- OTP Verification Modal -->
    <div id="otpModal" class="modal">
        <div class="modal-content">
            <h2>Enter OTP</h2>
            <p style="color:#8b9bb4; font-size:13px; margin-bottom:15px;">Check your email for the verification code.</p>
            <form id="otpForm">
                <div class="input-group">
                    <input type="text" id="otp-input" placeholder="Enter 6-digit OTP" required style="text-align: center; letter-spacing: 4px; font-size: 18px;">
                </div>
                <button type="submit" class="btn-primary" style="background: linear-gradient(90deg, #00b09b, #96c93d); margin-top: 5px;">Verify & Complete</button>
            </form>
        </div>
    </div>

    <script>
        let registeredEmail = '';
        const signupModal = document.getElementById('signupModal');
        const otpModal = document.getElementById('otpModal');

        document.getElementById('openSignup').addEventListener('click', (e) => {
            e.preventDefault();
            signupModal.style.display = 'flex';
        });

        document.getElementById('closeSignup').addEventListener('click', () => {
            signupModal.style.display = 'none';
        });

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('su-name').value;
            registeredEmail = document.getElementById('su-email').value;
            const age = document.getElementById('su-age').value;
            const password = document.getElementById('su-password').value;

            const res = await fetch('/api/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email: registeredEmail, age, password })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) {
                signupModal.style.display = 'none';
                otpModal.style.display = 'flex';
            }
        });

        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = document.getElementById('otp-input').value;

            const res = await fetch('/api/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: registeredEmail, otp })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) {
                otpModal.style.display = 'none';
                window.location.reload();
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) {
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/dashboard';
            }
        });
    </script>
</body>
</html>
