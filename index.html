<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSec Academy - Login</title>
    <link rel="stylesheet" href="code-with-bazigarr.css">
</head>
<body>

    <!-- Animated Background -->
    <div class="background">
        <div class="wave"></div>
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
    </div>

    <!-- Login Wrapper -->
    <div class="login-wrapper">
        <div class="login-card">
            <div class="card-content">
                
                <div class="heading">
                    <h1>Login</h1>
                    <span>PLEASE SIGN IN TO CONTINUE</span>
                </div>
                
                <form id="loginForm">
                    <div class="input-group">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="login-email" placeholder="Email Address" required>
                    </div>
                    
                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="login-password" placeholder="Password" required>
                        <button type="button" class="eye" id="togglePassword">👁️</button>
                    </div>
                    
                    <div class="options">
                        <label class="remember">
                            <input type="checkbox">
                            <span class="checkbox"></span>
                            Remember me
                        </label>
                        <a href="#">Forgot password?</a>
                    </div>

                    <button type="submit" class="login-btn">
                        <span>Login</span>
                        <strong>→</strong>
                    </button>
                </form>

                <div class="divider">
                    <span></span>
                    <p>OR CONTINUE WITH</p>
                    <span></span>
                </div>

                <div class="social">
                    <button type="button">G</button>
                    <button type="button">f</button>
                    <button type="button">in</button>
                </div>

                <div class="signup">
                    Don't have an account? <a href="#" id="openSignup">Signup</a>
                </div>

            </div>
        </div>
    </div>

    <!-- Sign Up Modal -->
    <div id="signupModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:#121623; padding:30px; border-radius:20px; width:90%; max-width:380px; color:#fff; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 0 30px rgba(255,0,128,0.3);">
            <h2 style="margin-bottom: 5px; text-align: center;">Create Account</h2>
            <p style="color: #8b9bb4; font-size: 13px; margin-bottom: 20px; text-align: center;">Join CyberSec Academy today</p>
            
            <form id="signupForm">
                <div style="margin-bottom: 12px;">
                    <input type="text" id="su-name" placeholder="Full Name" required style="width:100%; padding:12px; background:#151b2b; border:1px solid #2a344d; color:#fff; border-radius:10px; outline:none;">
                </div>
                <div style="margin-bottom: 12px;">
                    <input type="email" id="su-email" placeholder="Email Address" required style="width:100%; padding:12px; background:#151b2b; border:1px solid #2a344d; color:#fff; border-radius:10px; outline:none;">
                </div>
                <div style="margin-bottom: 12px;">
                    <input type="number" id="su-age" placeholder="Age" required style="width:100%; padding:12px; background:#151b2b; border:1px solid #2a344d; color:#fff; border-radius:10px; outline:none;">
                </div>
                <div style="margin-bottom: 15px;">
                    <input type="password" id="su-password" placeholder="Password" required style="width:100%; padding:12px; background:#151b2b; border:1px solid #2a344d; color:#fff; border-radius:10px; outline:none;">
                </div>
                
                <button type="submit" style="width:100%; padding:12px; background:linear-gradient(90deg, #ff2a75, #ff6b3d); border:none; color:#fff; font-weight:bold; border-radius:10px; cursor:pointer;">Send OTP</button>
            </form>
            <button id="closeSignup" style="width:100%; padding:10px; background:transparent; border:1px solid #2a344d; color:#8b9bb4; margin-top:10px; border-radius:10px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <!-- OTP Verification Modal -->
    <div id="otpModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1001; justify-content:center; align-items:center;">
        <div style="background:#121623; padding:30px; border-radius:20px; width:90%; max-width:380px; color:#fff; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 0 30px rgba(0,255,204,0.2); text-align: center;">
            <h2>Enter OTP</h2>
            <p style="color:#8b9bb4; font-size:13px; margin-bottom:15px;">Check your email for the verification code.</p>
            <form id="otpForm">
                <div style="margin-bottom: 15px;">
                    <input type="text" id="otp-input" placeholder="Enter 6-digit OTP" required style="width:100%; padding:12px; background:#151b2b; border:1px solid #2a344d; color:#fff; border-radius:10px; text-align:center; font-size:18px; letter-spacing:4px; outline:none;">
                </div>
                <button type="submit" style="width:100%; padding:12px; background:linear-gradient(90deg, #00b09b, #96c93d); border:none; color:#fff; font-weight:bold; border-radius:10px; cursor:pointer;">Verify & Complete</button>
            </form>
        </div>
    </div>

    <script>
        let registeredEmail = '';
        const signupModal = document.getElementById('signupModal');
        const otpModal = document.getElementById('otpModal');

        document.getElementById('openSignup').addEventListener('click', (e) => {
            e.preventDefault();
            signupModal.style.display = 'flex';
        });

        document.getElementById('closeSignup').addEventListener('click', () => {
            signupModal.style.display = 'none';
        });

        // Toggle Password Visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('login-password');
        if(togglePassword) {
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
            });
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('su-name').value;
            registeredEmail = document.getElementById('su-email').value;
            const age = document.getElementById('su-age').value;
            const password = document.getElementById('su-password').value;

            const res = await fetch('/api/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email: registeredEmail, age, password })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) {
                signupModal.style.display = 'none';
                otpModal.style.display = 'flex';
            }
        });

        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = document.getElementById('otp-input').value;

            const res = await fetch('/api/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: registeredEmail, otp })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) {
                otpModal.style.display = 'none';
                window.location.reload();
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) {
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/dashboard';
            }
        });
    </script>
</body>
</html>
